name: atlas-phase2

services:
  postgis:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: ${ATLAS_DATABASE_NAME:-atlas_phase2}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - atlas_phase2_postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.production
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${ATLAS_DATABASE_URL:?Set ATLAS_DATABASE_URL in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL in .env}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:?Set TRUSTED_ORIGINS in .env}
      GEOCODER_URL: http://photon:2322
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org/search}
      ROUTING_URL: http://graphhopper:8989
    depends_on:
      postgis:
        condition: service_healthy
      photon:
        condition: service_started
      graphhopper:
        condition: service_started
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(async r=>process.exit(r.ok&&(await r.json()).status==='ok'?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5m
    restart: unless-stopped

  photon:
    image: eclipse-temurin:25-jre
    working_dir: /data
    command: ["java", "-Xms256m", "-Xmx1g", "-jar", "/data/photon-1.3.0.jar", "serve", "-listen-ip", "0.0.0.0", "-listen-port", "2322", "-max-results", "5"]
    volumes:
      - "${PHOTON_DATA_DIR:-./var/providers/photon}:/data"
    expose:
      - "2322"
    restart: unless-stopped

  graphhopper:
    image: eclipse-temurin:25-jre
    working_dir: /data
    command: ["java", "-Xms512m", "-Xmx4g", "-jar", "/data/graphhopper-web-11.0.jar", "server", "/app/graphhopper.yml"]
    volumes:
      - "${GRAPHHOPPER_DATA_DIR:-./var/providers/graphhopper}:/data"
      - "./deploy/graphhopper.yml:/app/graphhopper.yml:ro"
    expose:
      - "8989"
    restart: unless-stopped

  bootstrap-admin:
    profiles: [bootstrap]
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.production
    command: ["node", "dist/auth/bootstrap-admin.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${ATLAS_DATABASE_URL:?Set ATLAS_DATABASE_URL in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL in .env}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:?Set TRUSTED_ORIGINS in .env}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-ATLAS Admin}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.production
    ports:
      - "${WEB_HTTP_BIND:-0.0.0.0:80}:80"
      - "${WEB_HTTPS_BIND:-0.0.0.0:443}:443"
    volumes:
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ./var/certbot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  atlas_phase2_postgis_data:
