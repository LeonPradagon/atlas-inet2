limit_req_zone $binary_remote_addr zone=provider:10m rate=10r/s;

server {
  listen 443 ssl;
  server_name kuma.110-239-80-32.sslip.io;
  ssl_certificate /etc/letsencrypt/live/kuma.110-239-80-32.sslip.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/kuma.110-239-80-32.sslip.io/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  resolver 127.0.0.11 valid=30s;
  location / {
    auth_basic "Uptime Kuma";
    auth_basic_user_file /etc/nginx/kuma/.htpasswd;
    set $kuma_upstream uptime-kuma:3001;
    proxy_pass http://$kuma_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 180s;
  }
}

server {
  listen 80;
  server_name 110.239.80.32;
  client_max_body_size 60m;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl default_server;
  server_name 110.239.80.32;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 60m;

  ssl_certificate /etc/letsencrypt/live/110.239.80.32/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/110.239.80.32/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css image/svg+xml;

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 180s;
  }

  location /photon/ {
    limit_req zone=provider burst=20 nodelay;
    proxy_pass http://photon:2322/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /graphhopper/ {
    limit_req zone=provider burst=10 nodelay;
    proxy_pass http://graphhopper:8989/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
