<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="#f4f6f9" name="theme-color">
    <script>
    "use strict";
    let theme;
    try {
      theme = localStorage.getItem("atlas-theme");
    } catch {
      // Storage is blocked; fall back to the system theme.
    }
    if (theme !== "light" && theme !== "dark") {
      theme = matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
    }
    document.documentElement.dataset.bsTheme = theme;
    document.querySelector('meta[name="theme-color"]').content =
      theme === "dark" ? "#101827" : "#f4f6f9";
    </script>
    <meta
      content="ATLAS - Asset Tracking, Location Analytics & Sales Intelligence Tools"
      name="description"
    >
    <title>ATLAS | Network Intelligence</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
