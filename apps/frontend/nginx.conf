limit_req_zone $binary_remote_addr zone=provider:10m rate=10r/s;

server {
  listen 80;
  server_name 110.239.80.32;
  client_max_body_size 60m;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name 110.239.80.32;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 60m;

  ssl_certificate /etc/letsencrypt/live/110.239.80.32/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/110.239.80.32/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 180s;
  }

  location /photon/ {
    limit_req zone=provider burst=20 nodelay;
    proxy_pass http://photon:2322/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /graphhopper/ {
    limit_req zone=provider burst=10 nodelay;
    proxy_pass http://graphhopper:8989/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
