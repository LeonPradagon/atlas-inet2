services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.9
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-kuma:/app/data
    networks:
      - atlas

networks:
  atlas:
    external: true
    name: atlas-phase2_default

volumes:
  uptime-kuma:
    external: true
    name: uptime-kuma
